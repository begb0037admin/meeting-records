<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting prep intake</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>Meeting prep intake</h1><p class="intro">Create a locked source record for a speaking brief.</p>
<section><h2>Meeting</h2><label>Recurring meeting <select id="meetingSelect"><option value="">Choose a meeting</option></select></label><label>Or ad-hoc title <input id="adHocTitle" maxlength="160"></label><label>Date <input id="meetingDate" type="date" required></label><button id="newRecurring" type="button">Create recurring definition</button><p id="meetingMessage" class="message"></p></section>
<section><div class="section-head"><h2>Agenda items</h2><button id="addItem" type="button">Add item</button></div><p>Drag items to set visual order. Priority is separate and stays numeric.</p><div id="items" aria-live="polite"></div><template id="itemTemplate"><article class="item" draggable="true"><header><span class="drag" title="Drag to reorder">⋮⋮</span><strong class="item-number"></strong><button class="remove" type="button">Remove</button></header><label>Title <input class="title" maxlength="200" required></label><div class="row"><label>Tone <select class="tone"><option value="update">Update</option><option value="raise">Raise</option><option value="fyi">FYI</option><option value="decision-needed">Decision needed</option></select></label><label>Priority <input class="priority" type="number" min="0" step="1" value="1" required></label></div><label>Detail / pasted source <textarea class="detail" required></textarea></label><label>Confirmed context <textarea class="context" placeholder="Only material Kevin has explicitly confirmed"></textarea></label><label>Speaker-note seed <textarea class="seed" placeholder="Optional; Lauren fills this later"></textarea></label><div class="carry"></div><section class="chat-panel"><h3>Ask Lauren</h3><div class="chat-messages" aria-live="polite"></div><textarea class="chat-input" placeholder="Ask about this agenda item"></textarea><div class="chat-actions"><button class="chat-send" type="button">Send</button><button class="mic" type="button">Mic</button><button class="listen" type="button">Listen</button><button class="attach-context" type="button">Attach to confirmed context</button></div><section class="extract-panel"><h3>Excel extraction</h3><input type="file" class="xlsx-file" accept=".xlsx"><button class="extract-btn" type="button">Extract</button><div class="extract-sheets"></div><button class="attach-sheets" type="button">Attach selected sheets to confirmed context</button><p class="extract-message message" role="status"></p></section></section></article></template></section>
<button id="submit" type="button">Submit locked intake</button><p id="submitMessage" class="message" role="status"></p></main><script type="module" src="/app.js"></script></body></html>
