<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting prep intake</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>Meeting prep intake</h1><p class="intro">Create a locked source record for a speaking brief.</p>
<section><h2>Meeting</h2><label>Recurring meeting <select id="meetingSelect"><option value="">Choose a meeting</option></select></label><label>Or ad-hoc title <input id="adHocTitle" maxlength="160"></label><label>Date <input id="meetingDate" type="date" required></label><button id="newRecurring" type="button">Create recurring definition</button><p id="meetingMessage" class="message"></p></section>
<section><div class="section-head"><h2>Agenda items</h2><button id="addItem" type="button">Add item</button></div><p>Drag items to set visual order. Priority is separate and stays numeric.</p><div id="items" aria-live="polite"></div><template id="itemTemplate"><article class="item" draggable="true"><header><span class="drag" title="Drag to reorder">⋮⋮</span><strong class="item-number"></strong><button class="remove" type="button">Remove</button></header><label>Title <input class="title" maxlength="200" required></label><div class="row"><label>Tone <select class="tone"><option value="update">Update</option><option value="raise">Raise</option><option value="fyi">FYI</option><option value="decision-needed">Decision needed</option></select></label><label>Priority <input class="priority" type="number" min="0" step="1" value="1" required></label></div><label>Detail / pasted source <textarea class="detail" required></textarea></label><label>Confirmed context <textarea class="context" placeholder="Only material Kevin has explicitly confirmed"></textarea></label><label>Speaker-note seed <textarea class="seed" placeholder="Optional; Lauren fills this later"></textarea></label><div class="carry"></div><p class="phase-placeholder">Phase 2/3 attachment point: extraction, Lauren chat, voice, and file upload are not built in Phase 1.</p></article></template></section>
<button id="submit" type="button">Submit locked intake</button><p id="submitMessage" class="message" role="status"></p></main><script type="module" src="/app.js"></script></body></html>
